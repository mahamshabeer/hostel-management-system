<!DOCTYPE html>
<html>
<head>
  <title>Reports & Analytics</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-pink-50 p-6">

<!-- HEADER -->
<div class="flex justify-between items-center mb-8">

  <div>

    <h1 class="text-3xl font-bold text-gray-800">
      📊 Reports & Analytics
    </h1>

    <p class="text-gray-500 mt-1">
      Complete hostel analytics dashboard
    </p>

  </div>

  <button onclick="window.print()"
    class="bg-gradient-to-r from-indigo-500 to-purple-500
    hover:scale-105 transition text-white px-5 py-3 rounded-2xl shadow-lg">

    📄 Export PDF

  </button>

</div>

<!-- REPORT CARDS -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">

  <!-- USERS -->
  <div onclick="navigate('users.html')"
class="cursor-pointer p-6 rounded-2xl shadow-lg bg-emerald-500 text-white text-center hover:scale-105 transition">
    <h2 class="text-lg opacity-80">
      Total Users
    </h2>

    <p id="users"
      class="text-5xl font-bold mt-4">
      0
    </p>

  </div>

  <!-- ROOMS -->
  <div onclick="navigate('rooms.html')"
class="cursor-pointer p-6 rounded-2xl shadow-lg bg-sky bg-blue-600 text-white text-center hover:scale-105 transition">

    <h2 class="text-lg opacity-80">
      Total Rooms
    </h2>

    <p id="rooms"
      class="text-5xl font-bold mt-4">
      0
    </p>

  </div>

  <!-- REVENUE -->
  <div onclick="navigate('fees.html')"
class="cursor-pointer p-6 rounded-2xl shadow-lg bg-purple-500 text-white text-center hover:scale-105 transition">
    <h2 class="text-lg opacity-80">
      Revenue
    </h2>

    <p id="revenue"
      class="text-5xl font-bold mt-4">
      0
    </p>

  </div>

  <!-- OCCUPANCY -->
  <div onclick="navigate('rooms.html')"
class="cursor-pointer p-6 rounded-2xl shadow-lg bg-emerald-500 text-white text-center hover:scale-105 transition">
    <h2 class="text-lg opacity-80">
      Occupancy
    </h2>

    <p id="occupancy"
      class="text-5xl font-bold mt-4">
      0%
    </p>

  </div>

  <!-- COMPLAINTS -->
  <div onclick="navigate('complaints.html')"
class="cursor-pointer p-6 rounded-2xl shadow-lg bg-yellow-500 text-white text-center hover:scale-105 transition">
    <h2 class="text-lg opacity-80">
      Complaints
    </h2>

    <p id="complaints"
      class="text-5xl font-bold mt-4">
      0
    </p>

  </div>

  <!-- SOLVED -->
  <div onclick="navigate('complaints.html?status solved')"
class="cursor-pointer p-6 rounded-2xl shadow-lg bg-baby bg-pink-500 text-white text-center hover:scale-105 transition">
    <h2 class="text-lg opacity-80">
      Solved %
    </h2>

    <p id="solvedRate"
      class="text-5xl font-bold mt-4">
      0%
    </p>

  </div>

  <!-- PAID -->
  <div onclick="navigate('fees.html?status=paid')"
class="cursor-pointer p-6 rounded-2xl shadow-lg bg-blue-500 text-white text-center hover:scale-105 transition">
    <h2 class="text-lg opacity-80">
      Paid Fees
    </h2>

    <p id="paidFees"
      class="text-5xl font-bold mt-4">
      0
    </p>

  </div>

  <!-- PENDING -->
  <div onclick="navigate('fees.html?status=unpaid')"
class="cursor-pointer p-6 rounded-2xl shadow-lg bg-orange-500 text-white text-center hover:scale-105 transition">
    <h2 class="text-lg opacity-80">
      Pending Fees
    </h2>

    <p id="pendingFees"
      class="text-5xl font-bold mt-4">
      0
    </p>

  </div>

</div>

<script>

// ================= LOAD REPORTS =================
async function loadReports() {

  try {

    const [
      users,
      rooms,
      complaints,
      feeStats
    ] = await Promise.all([

      fetch("/users").then(r => r.json()),
      fetch("/rooms").then(r => r.json()),
      fetch("/complaints").then(r => r.json()),
      fetch("/fees/admin/stats").then(r => r.json())
    ]);

    // USERS
    document.getElementById("users").innerText =
      users.length;

    // ROOMS
    document.getElementById("rooms").innerText =
      rooms.length;

    // REVENUE
    document.getElementById("revenue").innerText =
      feeStats.totalCollection || 0;

    // PAID
    document.getElementById("paidFees").innerText =
      feeStats.totalPaid || 0;

    // PENDING
    document.getElementById("pendingFees").innerText =
      feeStats.pendingCollection || 0;

    // COMPLAINTS
    document.getElementById("complaints").innerText =
      complaints.length;

    // OCCUPANCY
    const totalCapacity =
      rooms.reduce((sum, r) => sum + r.capacity, 0);

    const occupiedSeats =
      rooms.reduce((sum, r) => sum + r.students.length, 0);

    const occupancy =
      totalCapacity > 0
        ? Math.round((occupiedSeats / totalCapacity) * 100)
        : 0;

    document.getElementById("occupancy").innerText =
      occupancy + "%";

    // SOLVED %
    const solved =
      complaints.filter(c =>
        c.status === "solved"
      ).length;

    const solvedRate =
      complaints.length > 0
        ? Math.round((solved / complaints.length) * 100)
        : 0;

    document.getElementById("solvedRate").innerText =
      solvedRate + "%";

  } catch (err) {

    console.log(err);

  }

}

loadReports();

function navigate(page) {
  window.location.href = page;
}

</script>

</body>
</html>
