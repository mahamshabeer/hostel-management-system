<!DOCTYPE html>
<html>
<head>
  <title>Admin Requests</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<h1 class="text-2xl font-bold mb-4">📩 Room Requests</h1>

<div id="list">Loading...</div>

<script>

async function loadRequests() {

  try {

    const res = await fetch("/admin/requests");
    const data = await res.json();

    const container = document.getElementById("list");

    if (!Array.isArray(data) || data.length === 0) {
      container.innerHTML = `<p class="text-gray-500">No requests found</p>`;
      return;
    }

    container.innerHTML = data.map(r => `
      <div class="bg-white p-4 mb-3 rounded shadow">

        <p><b>Student:</b> ${r.studentName || "N/A"}</p>

        <p><b>Room:</b> ${r.roomId?.roomNumber || "N/A"}</p>

        <p><b>Status:</b>
          <span class="${
            r.status === "approved"
              ? "text-green-600"
              : r.status === "rejected"
              ? "text-red-500"
              : "text-yellow-500"
          } font-bold">
            ${r.status}
          </span>
        </p>

      </div>
    `).join("");

  } catch (err) {

    console.log(err);

    document.getElementById("list").innerHTML =
      `<p class="text-red-500">Error loading requests</p>`;
  }
}

// ================= UPDATE REQUEST =================
async function updateRequest(id, action) {

  try {

    await fetch(`/admin/request/${id}/${action}`, {
      method: "POST"
    });

    loadRequests();

  } catch (err) {

    console.log("Update error:", err);
  }
}

// ================= DELETE REQUEST =================
async function deleteRequest(id) {

  const confirmDelete =
    confirm("Delete this request?");

  if (!confirmDelete) return;

  try {

    await fetch(`/request/${id}`, {
      method: "DELETE"
    });

    alert("Request deleted");

    loadRequests();

  } catch (err) {

    console.log("Delete failed:", err);

    alert("Delete failed");
  }
}

loadRequests();

setInterval(loadRequests, 5000);

</script>

</body>
</html>
