<!DOCTYPE html>
<html>

<head>
  <title>Student Complaints</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>

    body {
      font-family: sans-serif;
    }

    .glass-card {
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.4);
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .complaint-card {
      transition: 0.3s ease;
    }

    .complaint-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.08);
    }

    .btn {
      transition: 0.25s ease;
    }

    .btn:hover {
      transform: scale(1.03);
    }

  </style>

</head>

<body class="min-h-screen bg-gradient-to-br from-indigo-100 via-purple-100 to-pink-100 p-6">

  <!-- TOP BAR -->
  <div class="flex justify-between items-center mb-8">

    <h1 class="text-3xl font-bold text-gray-700">
      📝 My Complaints
    </h1>

    <button
      onclick="window.location.href='student-dashboard.html'"
      class="bg-indigo-500 hover:bg-indigo-600 text-white px-5 py-2 rounded-xl btn">

      ⬅ Back

    </button>

  </div>

  <!-- ADD COMPLAINT -->
  <div class="glass-card rounded-3xl p-6 mb-8">

    <h2 class="text-xl font-bold text-purple-700 mb-4">
      ➕ Submit New Complaint
    </h2>

    <textarea
      id="message"
      placeholder="Write your complaint here..."
      class="w-full border border-gray-200 rounded-2xl p-4 h-32 outline-none focus:ring-2 focus:ring-purple-400 resize-none"></textarea>

    <button
      onclick="submitComplaint()"
      class="mt-4 bg-purple-500 hover:bg-purple-600 text-white px-6 py-3 rounded-2xl btn">

      Submit Complaint

    </button>

  </div>

  <!-- COMPLAINTS -->
  <div>

    <h2 class="text-2xl font-bold text-gray-700 mb-5">
      📋 Complaint History
    </h2>

    <div
      id="complaintList"
      class="grid grid-cols-1 md:grid-cols-2 gap-5">
    </div>

  </div>

<script>

const userId = localStorage.getItem("userId");
const role = localStorage.getItem("role");

if (!userId || role !== "student") {
  window.location.href = "auth.html";
}

// ================= SUBMIT COMPLAINT =================
async function submitComplaint() {

  const message =
    document.getElementById("message").value;

  if (!message) {
    alert("Write complaint first");
    return;
  }

  const res = await fetch("/complaints/add", {

    method: "POST",

    headers: {
  "Content-Type": "application/json",
  role: localStorage.getItem("role"),
  userid: localStorage.getItem("userId")
},

    body: JSON.stringify({
      userId,
      message
    })

  });

  const data = await res.json();

  alert("Complaint Submitted ✔");

  document.getElementById("message").value = "";

  loadComplaints();
}

// ================= LOAD COMPLAINTS =================
async function loadComplaints() {

  const res = await fetch("/complaints");

  const data = await res.json();

  const myComplaints = data.filter(c =>
    String(c.userId?._id || c.userId) === String(userId)
  );

  const container =
    document.getElementById("complaintList");

  if (!myComplaints.length) {

    container.innerHTML = `

      <div class="glass-card rounded-3xl p-6 text-center col-span-full">

        <h2 class="text-xl font-bold text-gray-600">
          No complaints found
        </h2>

      </div>

    `;

    return;
  }

  container.innerHTML = myComplaints.map(c => `

    <div class="glass-card rounded-3xl p-5 complaint-card">

      <div class="flex justify-between items-center mb-4">

        <h2 class="font-bold text-lg text-gray-700">
          Complaint
        </h2>

        <span class="
          px-3 py-1 rounded-full text-sm font-bold
          ${c.status === "pending"
            ? "bg-yellow-100 text-yellow-700"
            : "bg-green-100 text-green-700"}
        ">

          ${c.status.toUpperCase()}

        </span>

      </div>

      <p class="text-gray-600 leading-relaxed">
        ${c.message}
      </p>

      ${c.status === "pending" ? `

        <button
          onclick="cancelComplaint('${c._id}')"
          class="mt-5 bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-xl btn">

          Cancel Complaint

        </button>

      ` : ""}

    </div>

  `).join("");
}

// ================= CANCEL =================
async function cancelComplaint(id) {

  if (!confirm("Cancel complaint?")) return;

  const res = await fetch(`/complaints/${id}`, {
    method: "DELETE"
  });

  const data = await res.json();

  alert(data.message);

  loadComplaints();
}

// INIT
loadComplaints();

</script>

</body>
</html>
