<!DOCTYPE html>
<html>
<head>
  <title>Student Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center p-6
bg-cover bg-center bg-no-repeat"
style="background-image: url('https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=1500&q=80');">

<div class="max-w-4xl mx-auto bg-white shadow-xl rounded-3xl p-8">

  <h1 class="text-3xl font-bold text-gray-800 mb-6">👤 My Profile</h1>

  <div class="flex flex-col md:flex-row gap-8">

    <!-- LEFT SIDE - PROFILE IMAGE -->
    <div class="md:w-1/3 flex flex-col items-center">

      <div class="relative group">

        <img id="profilePic"
          src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
          class="w-32 h-32 rounded-full border-4 border-indigo-200 shadow-lg object-cover">

        <input type="file" id="profilePicFile" class="hidden">

        <!-- hover camera -->
        <div onclick="document.getElementById('profilePicFile').click()"
          class="absolute inset-0 flex items-center justify-center
                 bg-black/40 opacity-0 group-hover:opacity-100
                 rounded-full cursor-pointer transition text-white text-2xl">

          📷
        </div>

      </div>

      <p class="mt-3 text-gray-500 text-sm">Click to change photo</p>

    </div>

    <!-- RIGHT SIDE - FORM -->
    <div class="md:w-2/3 grid grid-cols-1 md:grid-cols-2 gap-4">

      <div>
        <label class="text-sm text-gray-500">Name</label>
        <input id="name" class="w-full mt-1 p-3 border rounded-xl">
      </div>

      <div>
        <label class="text-sm text-gray-500">Email</label>
        <input id="email" disabled class="w-full mt-1 p-3 border rounded-xl bg-gray-100">
      </div>

      <div>
        <label class="text-sm text-gray-500">Phone</label>
        <input id="phone" class="w-full mt-1 p-3 border rounded-xl">
      </div>

      <div>
        <label class="text-sm text-gray-500">Roll Number</label>
        <input id="rollNo" class="w-full mt-1 p-3 border rounded-xl">
      </div>

      <div>
        <label class="text-sm text-gray-500">City</label>
        <input id="city" class="w-full mt-1 p-3 border rounded-xl">
      </div>

      <div>
        <label class="text-sm text-gray-500">Emergency Contact</label>
        <input id="emergency" class="w-full mt-1 p-3 border rounded-xl">
      </div>

      <div class="md:col-span-2">
        <label class="text-sm text-gray-500">Address</label>
        <textarea id="address" class="w-full mt-1 p-3 border rounded-xl"></textarea>
      </div>

      <div class="md:col-span-2">
        <button onclick="updateProfile()"
          class="w-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500
          text-white py-3 rounded-xl shadow-lg hover:scale-[1.02] transition">

          💾 Save Profile
        </button>
      </div>

    </div>

  </div>
</div>

<script>

let currentUserId = localStorage.getItem("userId");

//===============LOAD PROFILE

async function loadProfile() {

  const res = await fetch("/users/" + currentUserId);
  const user = await res.json();

  if (!user) return;

  document.getElementById("name").value = user.name || "";
  document.getElementById("email").value = user.email || "";
  document.getElementById("phone").value = user.phone || "";
  document.getElementById("rollNo").value = user.rollNo || "";
  document.getElementById("city").value = user.city || "";
  document.getElementById("address").value = user.address || "";
  document.getElementById("emergency").value = user.emergency || "";

  // ✅ PROFILE PIC FIX
  document.getElementById("profilePic").src =
    user.profilePic
      ? window.location.origin + user.profilePic
      : "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
}

//===============UPDATE PROFILE
async function updateProfile() {

  const formData = new FormData();

  formData.append("name", document.getElementById("name").value);
  formData.append("email", document.getElementById("email").value);
  formData.append("phone", document.getElementById("phone").value);
  formData.append("rollNo", document.getElementById("rollNo").value);
  formData.append("city", document.getElementById("city").value);
  formData.append("address", document.getElementById("address").value);
  formData.append("emergency", document.getElementById("emergency").value);

  // ✅ IMAGE ADD
  const file = document.getElementById("profilePicFile").files[0];
  if (file) {
    formData.append("profilePic", file);
  }

  const res = await fetch("/users/update/" + currentUserId, {
    method: "PUT",
    body: formData
  });

  await res.json();

  // reload profile after update
  loadProfile();

  alert("Profile updated successfully ✅");
}
loadProfile();

</script>

</body>
</html>
