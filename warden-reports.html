<!DOCTYPE html>
<html>
<head>
  <title>Warden Reports</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-blue-50 to-cyan-50 p-6">

  <!-- HEADER -->
  <div class="flex justify-between items-center mb-6">

    <div>
      <h1 class="text-3xl font-bold text-gray-800">
        📊 Warden Reports
      </h1>

      <p class="text-gray-500">
        Hostel occupancy & room analytics
      </p>
    </div>

    <button onclick="goBack()"
      class="bg-indigo-500 hover:bg-indigo-600 text-white px-4 py-2 rounded-xl shadow">

      ← Back

    </button>

  </div>

  <!-- REPORT CARDS -->
  <div class="grid grid-cols-1 md:grid-cols-4 gap-6">

    
    <!-- TOTAL ROOMS -->
<div onclick="showAllRooms()"
class="cursor-pointer hover:scale-105 transition bg-blue-500 text-white rounded-3xl p-6 shadow-xl text-center">
      <h2 class="text-lg font-semibold">
        🏠 Total Rooms
      </h2>

      <p id="totalRooms"
        class="text-4xl font-bold mt-4">

        0

      </p>

    </div>

    
    <!-- AVAILABLE -->
<div onclick="showAvailableRooms()"
class="cursor-pointer hover:scale-105 transition bg-green-500 text-white rounded-3xl p-6 shadow-xl text-center">

      <h2 class="text-lg font-semibold">
        ✅ Available Rooms
      </h2>

      <p id="availableRooms"
        class="text-4xl font-bold mt-4">

        0

      </p>

    </div>

    
    <!-- FULL -->
<div onclick="showFullRooms()"
class="cursor-pointer hover:scale-105 transition bg-red-500 text-white rounded-3xl p-6 shadow-xl text-center">

      <h2 class="text-lg font-semibold">
        ❌ Full Rooms
      </h2>

      <p id="fullRooms"
        class="text-4xl font-bold mt-4">

        0

      </p>

    </div>

    
    <!-- OCCUPANCY -->
<div onclick="showOccupancyRooms()"
class="bg-cyan-500 text-white rounded-3xl p-6 shadow-xl text-center cursor-pointer hover:scale-105 transition">

      <h2 class="text-lg font-semibold">
        📈 Occupancy
      </h2>

      <p id="occupancyRate"
        class="text-4xl font-bold mt-4">

        0%

      </p>

    </div>

  </div>

  <!-- ROOM TABLE -->
  <div class="bg-white rounded-3xl shadow-xl p-6 mt-8">

    <h2 class="text-2xl font-bold text-gray-700 mb-4">
      🏠 Room Details
    </h2>

    <div id="roomTable">
      Loading...
    </div>

  </div>

<script>

function goBack() {
  window.location.href = "warden-dashboard.html";
}

function renderRoomTable(roomData) {

  const table =
    document.getElementById("roomTable");

  table.innerHTML = roomData.map(r => `

    <div class="border rounded-2xl p-4 mb-4 shadow-sm">

      <div class="flex justify-between items-center">

        <div>

          <h3 class="font-bold text-lg text-gray-700">
            🏠 Room ${r.roomNumber}
          </h3>

          <p class="text-gray-500">
            Capacity: ${r.capacity}
          </p>

        </div>

        <div class="${
          r.students.length >= r.capacity
            ? 'bg-red-500'
            : 'bg-green-500'
        } text-white px-4 py-2 rounded-xl">

          ${r.students.length}/${r.capacity}

        </div>

      </div>

    </div>

  `).join("");
}

let allRooms = [];

function showAllRooms() {
  renderRoomTable(allRooms);
}

function showAvailableRooms() {

  const filtered =
    allRooms.filter(r =>
      r.students.length < r.capacity
    );

  renderRoomTable(filtered);
}

function showFullRooms() {

  const filtered =
    allRooms.filter(r =>
      r.students.length >= r.capacity
    );

  renderRoomTable(filtered);
}

async function loadReports() {

  try {

    const res = await fetch("/rooms");

    const rooms = await res.json();
    allRooms = rooms;

    // TOTAL ROOMS
    document.getElementById("totalRooms").innerText =
      rooms.length;

    // AVAILABLE ROOMS
    const availableRooms =
      rooms.filter(r =>
        r.students.length < r.capacity
      ).length;

    document.getElementById("availableRooms").innerText =
      availableRooms;

    // FULL ROOMS
    const fullRooms =
      rooms.filter(r =>
        r.students.length >= r.capacity
      ).length;

    document.getElementById("fullRooms").innerText =
      fullRooms;

    // OCCUPANCY %
    const totalCapacity =
      rooms.reduce((sum, r) =>
        sum + r.capacity, 0);

    const occupied =
      rooms.reduce((sum, r) =>
        sum + r.students.length, 0);

    const occupancy =
      totalCapacity > 0
        ? Math.round((occupied / totalCapacity) * 100)
        : 0;

    document.getElementById("occupancyRate").innerText =
      occupancy + "%";

    // ROOM TABLE
    const table =
      document.getElementById("roomTable");
     
      renderRoomTable(rooms);
    
  }

  catch (err) {

    console.log(err);

  }

}

function renderRoomTable(rooms) {

  const table =
    document.getElementById("roomTable");

  if (!rooms.length) {

    table.innerHTML =
      "<p>No rooms found</p>";

    return;
  }

  table.innerHTML = rooms.map(r => `

    <div onclick="openRoom('${r._id}')"
      class="border rounded-2xl p-4 mb-4 shadow-sm cursor-pointer hover:shadow-xl hover:scale-[1.02] transition bg-white">

      <div class="flex justify-between items-center">

        <div>

          <h3 class="font-bold text-lg text-gray-700">
            🏠 Room ${r.roomNumber}
          </h3>

          <p class="text-gray-500">
            Capacity: ${r.capacity}
          </p>

        </div>

        <div class="${
          r.students.length >= r.capacity
            ? 'bg-red-500'
            : 'bg-green-500'
        } text-white px-4 py-2 rounded-xl">

          ${r.students.length}/${r.capacity}

        </div>

      </div>

    </div>

  `).join("");
}

loadReports();

function showOccupancyRooms() {

  const occupiedRooms =
    allRooms.filter(r =>
      r.students.length > 0
    );

  renderRoomTable(occupiedRooms);
}

</script>

</body>
</html>
